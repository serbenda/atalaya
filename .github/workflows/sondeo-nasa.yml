name: Sondeo NASA
on:
  push:
    branches: [sondeo-nasa]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q h5py numpy
      - name: Sondear
        shell: python
        run: |
          import os, json, urllib.request, urllib.error, datetime, re
          T = os.environ["TOKEN"].strip()
          print("token presente:", bool(T), "longitud", len(T))
          def get(url, n=600, guardar=None):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {T}", "User-Agent": "atalaya/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = r.read()
                      print("OK", r.status, url, len(data), "bytes")
                      if guardar:
                          open(guardar, "wb").write(data)
                      return data
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, url, e.read()[:300])
              except Exception as e:
                  print("ERR", url, e)
          hoy = datetime.date.today()
          import h5py
          def listar(base, prod, maxdias=6):
              for d in range(0, maxdias):
                  f = hoy - datetime.timedelta(days=d)
                  b = get(f"{base}/api/v2/content/details/allData/5200/{prod}/{f.year}/{f.timetuple().tm_yday:03d}?format=json")
                  if b:
                      items = json.loads(b).get("content", [])
                      if items:
                          return f, items
              return None, []
          def recorrer(h, prefijo=""):
              for k, v in h.items():
                  if isinstance(v, h5py.Dataset):
                      print("   ", prefijo + k, v.shape, v.dtype, dict(list(v.attrs.items())[:4]))
                  else:
                      recorrer(v, prefijo + k + "/")
          for prod in ("VJ146A3", "VNP46A3"):
              for m in range(0, 4):
                  y, mo = hoy.year, hoy.month - m
                  while mo <= 0:
                      mo += 12; y -= 1
                  doy = datetime.date(y, mo, 1).timetuple().tm_yday
                  b = get(f"https://ladsweb.modaps.eosdis.nasa.gov/api/v2/content/details/allData/5200/{prod}/{y}/{doy:03d}?format=json")
                  if b and json.loads(b).get("content"):
                      items = json.loads(b)["content"]
                      t = next((x for x in items if ".h21v05." in x["name"]), items[0])
                      print(prod, y, mo, len(items), t["name"], t.get("size"))
                      if get(t["downloadsLink"], guardar="m.h5"):
                          with h5py.File("m.h5") as h:
                              recorrer(h)
                      break
          import time
          t0 = time.time()
          f, items = listar("https://ladsweb.modaps.eosdis.nasa.gov", "VJ146A2")
          t = next(x for x in items if ".h21v05." in x["name"])
          get(t["downloadsLink"], guardar="d.h5")
          print("descarga h21v05 en", round(time.time() - t0, 1), "s")
          import numpy as np
          with h5py.File("d.h5") as h:
              g = h["HDFEOS/GRIDS/VIIRS_Grid_DNB_2d/Data Fields"]
              lat, lon = g["lat"][:], g["lon"][:]
              print("lat", lat[0], lat[-1], "lon", lon[0], lon[-1])
              for nombre, la, lo in (("Damasco", 33.51, 36.29), ("Beirut", 33.89, 35.50), ("Bagdad", 33.31, 44.37), ("Gaza", 31.50, 34.47)):
                  if lat[-1] <= la <= lat[0] and lon[0] <= lo <= lon[-1]:
                      i = int(np.argmin(abs(lat - la))); j = int(np.argmin(abs(lon - lo)))
                      v = g["DNB_BRDF-Corrected_NTL"][i-10:i+11, j-10:j+11]; q = g["Mandatory_Quality_Flag"][i-10:i+11, j-10:j+11]
                      gf = g["Gap_Filled_DNB_BRDF-Corrected_NTL"][i-10:i+11, j-10:j+11]
                      ok = (q == 0) & (v > -999)
                      print(nombre, "validos", int(ok.sum()), "media", float(v[ok].mean()) if ok.any() else None, "gapfilled", float(gf[gf > -999].mean()))
          for base, prod in ():
              f, items = listar(base, prod)
              print(prod, f, len(items), "ficheros")
              tile = next((x for x in items if ".h21v05." in x["name"]), items[0] if items else None)  # Oriente Próximo
              if tile:
                  print("  tamaño", tile.get("size"), tile["name"])
                  if get(tile["downloadsLink"], guardar="t.h5"):
                      with h5py.File("t.h5") as h:
                          recorrer(h)
