name: Sondeo NASA
on:
  push:
    branches: [sondeo-nasa]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      ATALAYA_SALIDA: ${{ github.workspace }}/salida/data
      ATALAYA_DEPURAR: "1"
    steps:
      - uses: actions/checkout@v4
        with: { ref: development }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q h5py numpy
      - run: |
          mkdir -p salida/data
          git fetch --depth=1 origin datos
          git --work-tree=salida checkout FETCH_HEAD -- data/alertas.json data/eventos.json
          git reset -q
          python scripts/luces.py
          python scripts/luces.py
          python scripts/luces.py
          python -c "import json; d=json.load(open('salida/data/luces_historial.json')); print({k: len(v) for k, v in d.items()}); print(list(d.items())[:2])"
