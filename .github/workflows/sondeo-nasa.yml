name: Sondeo NASA
on:
  push:
    branches: [sondeo-nasa]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q h5py numpy
      - name: Sondear
        shell: python
        run: |
          import os, json, urllib.request, urllib.error, datetime, re
          T = os.environ["TOKEN"].strip()
          print("token presente:", bool(T), "longitud", len(T))
          def get(url, n=600, guardar=None):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {T}", "User-Agent": "atalaya/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = r.read()
                      print("OK", r.status, url, len(data), "bytes")
                      if guardar:
                          open(guardar, "wb").write(data)
                      return data
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, url, e.read()[:300])
              except Exception as e:
                  print("ERR", url, e)
          hoy = datetime.date.today()
          import h5py
          def listar(base, prod, maxdias=6):
              for d in range(0, maxdias):
                  f = hoy - datetime.timedelta(days=d)
                  b = get(f"{base}/api/v2/content/details/allData/5200/{prod}/{f.year}/{f.timetuple().tm_yday:03d}?format=json")
                  if b:
                      items = json.loads(b).get("content", [])
                      if items:
                          return f, items
              return None, []
          def recorrer(h, prefijo=""):
              for k, v in h.items():
                  if isinstance(v, h5py.Dataset):
                      print("   ", prefijo + k, v.shape, v.dtype, dict(list(v.attrs.items())[:4]))
                  else:
                      recorrer(v, prefijo + k + "/")
          for base, prod in (("https://nrt3.modaps.eosdis.nasa.gov", "VJ146A1_NRT"), ("https://ladsweb.modaps.eosdis.nasa.gov", "VJ146A2")):
              f, items = listar(base, prod)
              print(prod, f, len(items), "ficheros")
              tile = next((x for x in items if ".h21v05." in x["name"]), items[0] if items else None)  # Oriente Próximo
              if tile:
                  print("  tamaño", tile.get("size"), tile["name"])
                  if get(tile["downloadsLink"], guardar="t.h5"):
                      with h5py.File("t.h5") as h:
                          recorrer(h)
          b = get("https://gpm1.gesdisc.eosdis.nasa.gov/data/GPM_L3/GPM_3IMERGDE.07/2026/11/")
          nombres = sorted(set(re.findall(rb'href="(3B-DAY-E[^"]+\.nc4)"', b or b"")))
          print("IMERG", nombres[-2:])
          if nombres:
              url = "https://gpm1.gesdisc.eosdis.nasa.gov/data/GPM_L3/GPM_3IMERGDE.07/2026/11/" + nombres[-1].decode()
              if get(url, guardar="i.nc4"):
                  with h5py.File("i.nc4") as h:
                      recorrer(h)
