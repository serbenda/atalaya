name: Sondeo NASA
on:
  push:
    branches: [sondeo-nasa]
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      ATALAYA_SALIDA: ${{ github.workspace }}/salida/data
      ATALAYA_DEPURAR: "1"
    steps:
      - uses: actions/checkout@v4
        with: { ref: development }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q h5py numpy
      - run: |
          mkdir -p salida/data
          git fetch --depth=1 origin datos
          git --work-tree=salida checkout FETCH_HEAD -- data/alertas.json data/eventos.json
          git reset -q
          python - <<'PY'
          import sys, datetime
          sys.path.insert(0, "scripts")
          import luces
          for prod, dia in (("VJ146A3", datetime.date(2026, 10, 1)), ("VNP46A3", datetime.date(2026, 10, 1)),
                            ("VJ146A2", datetime.date(2026, 11, 4)), ("VNP46A2", datetime.date(2026, 11, 2)),
                            ("VJ146A1", datetime.date(2026, 11, 4)), ("VNP46A1", datetime.date(2026, 11, 2))):
              t = luces.ficheros_del_dia(prod, dia)
              hs = sorted(t)
              print(prod, dia, len(t), "h21v07" in t, "h21v05" in t, "h17v04" in t, hs[:3], hs[-3:])
              vs = sorted({k[3:] for k in t}); print("   filas v:", vs)
          PY
